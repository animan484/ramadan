<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>የረመዳን ስጦታ</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark-green: #064e3b;
            --light-cream: #fffbeb;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark-green);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            color: var(--light-cream);
        }

        /* --- አኒሜሽን ያላቸው ፎቶዎች ማስቀመጫ (Borders) --- */
        .moving-images {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* --- ዳር ዳር የሚዞሩ ፎቶዎች --- */
.side-img {
    position: absolute;
    width: 60px; /* የፎቶው ስፋት */
    opacity: 1;
    z-index: 5;
    /* አኒሜሽኑ እዚህ ጋር ይገለጻል */
    animation: borderLoop 20s linear infinite;
}

/* እያንዳንዱ ፎቶ በተለያየ ሰከንድ እንዲነሳ በማድረግ ቅደም ተከተል ማስያዝ (10 ፎቶ ካለህ እስከ 10 ቀጥል) */
.img-1 { animation-delay: 0s; }
.img-2 { animation-delay: -2s; }
.img-3 { animation-delay: -4s; }
.img-4 { animation-delay: -6s; }
.img-5 { animation-delay: -8s; }
.img-6 { animation-delay: -10s; }
.img-7 { animation-delay: -12s; }
.img-8 { animation-delay: -14s; }
.img-9 { animation-delay: -16s; }
.img-10 { animation-delay: -18s; }

/* ዙሪያውን እንዲዞሩ የሚያደርገው ዋናው አኒሜሽን */
@keyframes borderLoop {
    0%   { top: 0; left: 0; }             /* ከላይ በግራ */
    25%  { top: 0; left: calc(100% - 60px); } /* ወደ ላይ ቀኝ */
    50%  { top: calc(100% - 60px); left: calc(100% - 60px); } /* ወደ ታች ቀኝ */
    75%  { top: calc(100% - 60px); left: 0; } /* ወደ ታች ግራ */
    100% { top: 0; left: 0; }             /* ተመልሶ መጀመሪያ ቦታ */
}

        /* --- ዋናው ማሳያ (Main Card) --- */
        .container {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid var(--gold);
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            max-width: 90%;
            margin-top: 100px;
            margin-left: 20px;
            margin-right: 20px;
            max-height: 70%;
            overflow-y: auto;
            align-items: center;
            margin-bottom: 100px;
        }

        .gift-icon {
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.3s ease;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }

        .gift-icon:hover { transform: scale(1.2); }

        h1 { color: var(--gold); font-size: 2.5rem; }
        
        #messageArea { display: none; }

        input {
            padding: 10px;
            border-radius: 5px;
            border: none;
            width: 80%;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        button {
    background-color: var(--gold);
    color: #033319; /* Dark green text on gold button looks very 'Royal' */
    box-shadow: 0 4px 15px rgba(197, 174, 174, 0.3);
    border-radius: 15px;
    border: none;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 1rem;
    padding: 10px 20px;
    cursor: pointer;
}

        .ramadan-text {
            font-size: 2rem;
            line-height: 1.6;
            margin-top: 20px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

<div class="moving-images">
    <img src="r1.png" class="side-img img-1" alt="Ramadan">
    <img src="r2.png" class="side-img img-2" alt="Ramadan">
    <img src="r3.png" class="side-img img-3" alt="Ramadan">
    <img src="r4.png" class="side-img img-4" alt="Ramadan">
    <img src="r5.png" class="side-img img-5" alt="Ramadan">
    <img src="r1.png" class="side-img img-6" alt="Ramadan">
    <img src="r2.png" class="side-img img-7" alt="Ramadan">
    <img src="r3.png" class="side-img img-8" alt="Ramadan">
    <img src="r4.png" class="side-img img-9" alt="Ramadan">
    <img src="r5.png" class="side-img img-10" alt="Ramadan">
</div>

    <div class="container">
        <div id="setupArea">
            <div class="gift-icon" onclick="showInput()"><img src="gift.png" alt="gift-icon" width="150" height="150"></div>
            <h1>ልዩ የረመዳን ስጦታ አለዎት!</h1>
            <p>ለመክፈት ስጦታውን ይጫኑ</p>
        </div>

        <div id="inputArea" style="display:none;">
            <h2>እባክዎን ስምዎን ያስገቡ</h2>
            <input type="text" id="userName" placeholder="ስም እዚህ ይፃፉ...">
            <br>
            <button onclick="generateGreeting()">አሳይ</button>
        </div>

        <div id="messageArea">
            <h1 id="displayName"></h1>
            <div class="ramadan-text">
                🌙 ረመዳን ሙባረክ! 🌙<br>
                አላህ ፆሙንና ዱዓውን ይቀበለን።
            </div>
            <p>መልካም የረመዳን ወር ይሁንልዎ! <br> <br>  በ አንዋር የተዘጋጀ </p>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="Ramadan.mp3" type="audio/mpeg">
        የእርስዎ ብሮውዘር ኦዲዮ አይደግፍም።
    </audio>

    <script>
        const bgMusic = document.getElementById('bgMusic');

        // ስጦታው ሲነካ ስም እንዲጠይቅ
        function showInput() {
            document.getElementById('setupArea').style.display = 'none';
            document.getElementById('inputArea').style.display = 'block';
        }

        // ስሙ ሲገባ መልዕክቱን እና ሙዚቃውን የሚከፍት
        function generateGreeting() {
            const name = document.getElementById('userName').value;
            if (name.trim() === "") {
                alert("እባክዎ ስምዎን ያስገቡ!");
                return;
            }

            document.getElementById('inputArea').style.display = 'none';
            document.getElementById('messageArea').style.display = 'block';
            document.getElementById('displayName').innerText = "ውድ " + name;
            var duration = 5 * 1000; // ለ5 ሰከንድ እንዲተኩስ
    var animationEnd = Date.now() + duration;
    var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000 };

    function randomInRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    var interval = setInterval(function() {
      var timeLeft = animationEnd - Date.now();

      if (timeLeft <= 0) {
        return clearInterval(interval);
      }

      var particleCount = 50 * (timeLeft / duration);
      // ከግራ እና ከቀኝ ተከታትሎ እንዲተኮስ
      confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
      confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
    }, 250);
            // ነሺዳውን ያስጀምራል
            bgMusic.play().catch(error => {
                console.log("Audio play failed: ", error);
            });
        }
        // This prevents the keyboard from squashing the layout on Android/Samsung
if (/Android/.test(navigator.userAgent)) {
   window.addEventListener("resize", function() {
      if (document.activeElement.tagName == "INPUT") {
         window.setTimeout(function() {
            document.activeElement.scrollIntoView({ behavior: "smooth" });
         }, 0);
      }
   });
}
    </script>
</body>
</html>
